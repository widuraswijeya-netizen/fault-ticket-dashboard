name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Ensure D1 session heartbeat column
        shell: bash
        run: |
          set -e
          schema="$(wrangler d1 execute fault-dashboard-users --remote --command="SELECT name FROM pragma_table_info('sessions') WHERE name='last_seen'" --json)"
          if echo "$schema" | grep -q 'last_seen'; then
            echo "sessions.last_seen already exists."
          else
            echo "Adding sessions.last_seen..."
            wrangler d1 execute fault-dashboard-users --remote --command='ALTER TABLE sessions ADD COLUMN last_seen TEXT;' --yes
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 257be0d9a5debb495211a815ed3de713

      - name: Deploy Worker and assets
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 257be0d9a5debb495211a815ed3de713
