name: Build Field Worker APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-webview/**'
      - '.github/workflows/build-fieldworker-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon -p android-webview assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GLOPMC-Field-Worker-APK
          path: android-webview/app/build/outputs/apk/debug/app-debug.apk
