<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#0b5fc6"><title>Field Worker - Faults</title><link rel="stylesheet" href="/worker.css"></head><body>
<div id="loginScreen" class="screen-center login-screen"><video class="login-bg-video" autoplay muted loop playsinline><source src="/Dashboard_video.mp4" type="video/mp4"></video><div class="login-bg-overlay"></div><div class="login-card"><div class="brand-mark">GL</div><h1>Field Worker</h1><p>Sign in with your service number to view faults.</p><form id="loginForm"><label>Service Number<input id="serviceNumber" inputmode="numeric" maxlength="6" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary-btn" type="submit">Log In</button><div id="loginError" class="error-text"></div></form></div></div>
<div id="app" class="app" hidden><header class="mobile-header"><button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button><div class="brand"><span class="brand-mark small">GL</span><span>Field Worker</span></div><button id="refreshBtn" class="icon-btn" aria-label="Refresh">↻</button></header>
<main><section id="categoryView"><div class="selection-heading"><div><h2>Select Fault Group</h2><p id="userLabel"></p></div></div><div id="categoryGrid" class="category-grid"></div></section>
<section id="faultView" hidden><div class="fault-heading"><div><button id="backCategoriesBtn" class="back-category-btn">← Fault Groups</button><h2 id="selectedTitle">Received Faults <span id="faultCount">0</span></h2><p id="selectedSummary"></p></div></div><div id="faultList" class="fault-list"></div><div id="emptyState" class="empty-state" hidden>No active faults found in this group.</div></section></main>
<div id="menuPanel" class="menu-panel" hidden><div class="menu-sheet"><div class="menu-title">Account</div><div id="menuUser"></div><button id="logoutBtn" class="menu-item danger">Log Out</button></div></div>
<div id="callModal" class="modal-backdrop" hidden><div class="bottom-sheet"><div class="sheet-handle"></div><h3>Call Customer</h3><p id="callTicketLabel"></p><a id="callFaBtn" class="call-option" href="#"><span>📞</span><span><strong>FA Contact Number</strong><small id="callFaNumber"></small></span></a><a id="callCircuitBtn" class="call-option" href="#"><span>☎</span><span><strong>Circuit Display Name</strong><small id="callCircuitNumber"></small></span></a><button id="closeCallBtn" class="cancel-btn">Cancel</button></div></div>
<div id="detailModal" class="modal-backdrop" hidden><div class="detail-sheet"><div class="sheet-head"><button id="closeDetailBtn" class="icon-btn">←</button><h3>Fault Details</h3><span></span></div><div id="detailBody"></div></div></div></div><script src="/worker.js"></script></body></html>
