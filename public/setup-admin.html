<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fault Dashboard — Initial Setup</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111827;margin:0;min-height:100vh;display:grid;place-items:center}
    .card{background:#fff;width:min(430px,calc(100% - 32px));padding:28px;border-radius:16px;box-sizing:border-box}
    h1{margin:0 0 8px;color:#1d4ed8;font-size:24px}
    p{color:#4b5563;line-height:1.5}
    label{display:block;font-weight:700;margin:18px 0 7px;color:#374151}
    input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
    button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
    #msg{margin-top:16px;font-weight:600}
    .note{font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Initial Administrator Setup</h1>
    <p>This one-time page creates the first administrator account for service number <strong>013633</strong>.</p>
    <p class="note">Choose the password yourself. It is sent directly to the Worker and stored only as a PBKDF2 password hash.</p>
    <form id="form">
      <label for="password">Administrator Password</label>
      <input id="password" type="password" minlength="10" required autocomplete="new-password">
      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password" minlength="10" required autocomplete="new-password">
      <button type="submit">Initialize Administrator</button>
    </form>
    <div id="msg"></div>
  </main>
<script>
const form=document.getElementById("form"), msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.textContent="";
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;
  if(password!==confirm){msg.textContent="Passwords do not match.";return;}
  if(!/[A-Z]/.test(password)||!/[a-z]/.test(password)||!/[0-9]/.test(password)||!/[^A-Za-z0-9]/.test(password)||password.length<10){
    msg.textContent="Use at least 10 characters with uppercase, lowercase, a number, and a special character.";return;
  }
  const r=await fetch("/api/setup-admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});
  const data=await r.json().catch(()=>({}));
  if(r.ok){
    msg.textContent="Administrator initialized successfully. You can now return to the dashboard and log in with service number 013633.";
    form.remove();
  }else msg.textContent=data.error||"Setup failed.";
});
</script>
</body>
</html>
